name: Update Proxy Data

on:
  # Run every Monday at 02:00 UTC
  schedule:
    - cron: '0 2 * * 1'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN — needs contents: write permission above
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data update
        run: npm run update-data
        env:
          # Free API key from https://fred.stlouisfed.org/docs/api/api_key.html
          # Add this as a repository secret: Settings → Secrets → Actions → New secret
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # No local proxy needed on GitHub Actions (direct network access)
          PROXY_URL: ''

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            TODAY=$(date -u '+%Y-%m-%d')
            git commit -m "chore: update proxy data ${TODAY} [skip ci]"
            git push
          fi
